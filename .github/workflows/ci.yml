name: CI

# First CI for the repository. The reliably-green calculation-authority
# regression runs as its own job so it gives a clean signal even while the
# broader service suite carries its documented, pre-existing aggregate reds.
#
# Three jobs: `golden-regression`, the `service-suite` shard matrix, and
# `service-suite-report`, which aggregates the shards into a diagnostic report.
#
# Runner: windows-latest — matches production (NSSM PZService, Windows, py3.9)
# and the environment all test-baseline counts were measured in. The Windows-only
# tests (test_review_bootstrap ×3, test_storage_health) therefore run for real.
#
# Python pinned to 3.9 — production runs 3.9.1; the root regression needs
# PYTHONUTF8=1 so Polish-language test prints can't crash on a cp1252 console.
#
# CI AUTHORITY (permanent): this workflow is DIAGNOSTIC ONLY. It must never
# gate merges or production deploys (CLAUDE.md § "CI authority — diagnostic,
# never a gate"). Branch protection must not require any job here without an
# explicit PROJECT_STATE.md DECISIONS entry. Aggregate exit uses
# `--fail-on never`: inherited reds, killed shards, missing artifacts, and
# malformed XML are printed truthfully and must not produce the recurring
# "Process completed with exit code 1" user-facing loop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Calculation authority: the ONLY landed-cost/duty/freight path ──────────
  # Deterministic 156-check non-e2e suite. The engine (pz_import_processor.py)
  # imports reportlab/openpyxl lazily, but the regression harness itself loads the
  # renderer module directly in check [23] (PDF/XLSX field sourcing), whose import
  # chain is pz_dual_export -> openpyxl + pz_pdf_export -> reportlab at module load.
  # Both are therefore required deps for the non-e2e run. The golden PDF pipeline
  # (--e2e) is still intentionally NOT run — the real invoice/ZC429 PDFs are
  # gitignored customs data, so e2e cannot run in CI.
  golden-regression:
    name: Golden regression (engine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install engine dependencies
        run: python -m pip install --upgrade pip pdfplumber requests openpyxl reportlab

      - name: Run golden regression (non-e2e)
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python test_pz_regression.py

  # ── Full service suite (sharded) ──────────────────────────────────────────
  # Deliberately no file count here: it drifts with every added test, and a
  # stale number in a comment reads as a contract. `tools/shard_tests.py --of 6
  # --describe` prints the current one.
  #
  # Runs the entire suite honestly. Standing inherited reds stay visible in the
  # aggregate step summary. The aggregate job exits 0 for all diagnostic
  # findings (`--fail-on never`). DHL/carrier credentials are absent on the
  # runner, so the 4 env-conditional carrier defaults tests PASS here.
  #
  # WHY SHARDED: the suite previously ran as one pytest process. pytest-timeout's
  # `thread` method (pytest.ini) cannot interrupt a blocked C call, so it kills
  # the whole process — one hung test discarded every result after it. Six
  # independent shards bound that loss to one sixth.
  #
  # TIMEOUT CONTAINMENT: job timeout-minutes=90; pytest step timeout-minutes=75.
  # The 15-minute buffer lets ensure_junit_artifact + upload always run after a
  # step timeout. Do not rely solely on pytest-timeout for process containment.
  #
  # SHARD MEMBERSHIP is sha256(relative posix path) % 6
  # (service/tools/shard_tests.py), so every runner computes the same partition
  # AND a file keeps its shard as the tree changes around it.
  #
  # Shards run in separate processes, so order-dependent failures will differ
  # from a monolithic run. That difference is diagnostic — not noise to tune out.
  service-suite:
    name: Service pytest (shard ${{ matrix.shard }}/6)
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false          # every shard must report, even if one dies
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r service/requirements.txt
          python -m pip install pytest pytest-timeout

      # Diagnostic step — never the workflow success authority.
      # Step timeout < job timeout so ensure+upload still run after a hang.
      - id: pytest
        name: Run service test suite (shard ${{ matrix.shard }}/6)
        working-directory: service
        timeout-minutes: 75
        continue-on-error: true
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        shell: pwsh
        run: |
          $files = python tools/shard_tests.py --shard ${{ matrix.shard }} --of 6
          if ($LASTEXITCODE -ne 0) { throw "shard planning failed" }
          Write-Host "shard ${{ matrix.shard }}/6 -> $($files.Count) files"
          python -m pytest $files -p no:cacheprovider -ra `
            --junitxml=junit-shard-${{ matrix.shard }}.xml

      # Normalize missing/empty JUnit into an explicit error sentinel.
      # Skip on runner cancellation — do not invent evidence after loss
      # (run 31717453274: shard 6 os._exit left no XML → MISSING-red aggregate).
      - name: Ensure JUnit artifact exists
        if: ${{ always() && !cancelled() }}
        working-directory: service
        shell: pwsh
        run: |
          python tools/ensure_junit_artifact.py `
            junit-shard-${{ matrix.shard }}.xml `
            --shard ${{ matrix.shard }} `
            --pytest-outcome "${{ steps.pytest.outcome }}"

      # warn, not error: upload must not become another red-gate authority.
      - name: Upload shard JUnit report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: service/junit-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

  # ── Aggregate the shards into one diagnostic reconciliation ───────────────
  # Prints every failure and every evidence state. Job exit uses
  # `--fail-on never`: diagnostic findings (TEST_FAILURE, PROCESS_KILLED,
  # STEP_TIMEOUT, MALFORMED_XML, MISSING_ARTIFACT) are visible in the summary
  # and must not fail this Actions job. Local forensic callers keep
  # `--fail-on any|incomplete`.
  #
  # BRANCH PROTECTION: intentionally unset. Requiring a shard job would be a
  # green light with nothing behind it (`continue-on-error: true` on pytest).
  #
  # `!cancelled()` rather than `always()`. A newer push cancels the in-flight
  # run; under `always()` the aggregate used to run on partial evidence and
  # produce noise. A cancelled run has no verdict to give — do not fake one.
  service-suite-report:
    name: Service pytest (aggregate)
    runs-on: ubuntu-latest
    needs: service-suite
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download every shard report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: junit-shard-*
          path: junit
          merge-multiple: true

      - name: Reconcile shard results
        run: |
          mkdir -p junit
          python service/tools/junit_summary.py junit --of 6 \
            --fail-on never \
            --markdown "$GITHUB_STEP_SUMMARY"

  # ── JavaScript reducer test ───────────────────────────────────────────────
  # One standalone node:test file (currency-aware Sales Receivable reducer). It
  # esbuild-transforms the real accounting-hub.jsx rather than duplicating the
  # logic, so it needs esbuild. That dependency used to be borrowed from the
  # service/frontend Vite app; when that duplicate frontend was retired the
  # dependency moved into service/tests/js, which owns it explicitly. Deliberately
  # scoped to this one test — no frontend build, no bundling, no lint pipeline.
  js-tests:
    name: JS reducer test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: service/tests/js/package-lock.json

      - name: Install JS test dependencies
        working-directory: service/tests/js
        run: npm ci

      - name: Run JS tests
        working-directory: service/tests/js
        run: npm test
