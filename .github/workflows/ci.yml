name: CI

# First CI for the repository. The reliably-green calculation-authority
# regression runs as its own job so it gives a clean signal even while the
# broader service suite carries its documented, pre-existing aggregate reds.
#
# Three jobs: `golden-regression`, the `service-suite` shard matrix, and
# `service-suite-report`, which aggregates the shards and carries the suite's
# verdict (see the branch-protection note above that job).
#
# Runner: windows-latest — matches production (NSSM PZService, Windows, py3.9)
# and the environment all test-baseline counts were measured in. The Windows-only
# tests (test_review_bootstrap ×3, test_storage_health) therefore run for real.
#
# Python pinned to 3.9 — production runs 3.9.1; the root regression needs
# PYTHONUTF8=1 so Polish-language test prints can't crash on a cp1252 console.
#
# NOTE: no job here is a required status check until branch protection is set
# (an admin action in GitHub repo settings, not something this workflow grants).
# When it is set, the suite's check is `Service pytest (aggregate)` — NOT a
# shard job; see the branch-protection note on `service-suite-report`.
# The first run establishes the honest baseline; it is not described as "green"
# until its own Actions run reports green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Calculation authority: the ONLY landed-cost/duty/freight path ──────────
  # Deterministic 156-check non-e2e suite. The engine (pz_import_processor.py)
  # imports reportlab/openpyxl lazily, but the regression harness itself loads the
  # renderer module directly in check [23] (PDF/XLSX field sourcing), whose import
  # chain is pz_dual_export -> openpyxl + pz_pdf_export -> reportlab at module load.
  # Both are therefore required deps for the non-e2e run. The golden PDF pipeline
  # (--e2e) is still intentionally NOT run — the real invoice/ZC429 PDFs are
  # gitignored customs data, so e2e cannot run in CI.
  golden-regression:
    name: Golden regression (engine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install engine dependencies
        run: python -m pip install --upgrade pip pdfplumber requests openpyxl reportlab

      - name: Run golden regression (non-e2e)
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python test_pz_regression.py

  # ── Full service suite (sharded) ──────────────────────────────────────────
  # Deliberately no file count here: it drifts with every added test, and a
  # stale number in a comment reads as a contract. `tools/shard_tests.py --of 6
  # --describe` prints the current one.
# Runs the entire suite honestly. The test-baseline documents pre-existing,
# order-dependent aggregate reds (stale V1 source-grep pins; asyncio/mock
# leakage) — those reds stay visible in the aggregate step summary. The
# aggregate job itself exits 0 when every shard reported (see
# `--fail-on incomplete` below) so inherited failures do not permanently red
# the Actions check. DHL/carrier credentials are absent on the runner, so the
# 4 env-conditional carrier defaults tests PASS here (they only fail on a
# creds-configured host).
  #
  # WHY SHARDED: the suite previously ran as one pytest process. pytest-timeout's
  # `thread` method (pytest.ini) cannot interrupt a blocked C call, so it kills
  # the whole process — one hung test discarded every result after it (a run died
  # at 77%, reporting a single timeout and hiding the standing failures in the
  # remaining 23%). Six independent shards bound that loss to one sixth, and the
  # aggregation step reports a lost shard as INCOMPLETE rather than as zero
  # failures.
  #
  # SHARD MEMBERSHIP is sha256(relative posix path) % 6
  # (service/tools/shard_tests.py), so every runner computes the same partition
  # AND a file keeps its shard as the tree changes around it. The earlier
  # size-based bin packing balanced better but re-derived membership from the
  # whole listing, so adding one test file could move unrelated files between
  # shards — which invalidates run-over-run shard comparison, the thing this
  # suite is triaged by. Balance is now statistical; the job timeout below is
  # what bounds a slow shard.
  #
  # Shards run in separate processes, so order-dependent failures will differ
  # from a monolithic run. That difference is diagnostic — it is how order
  # contamination gets separated from genuine regressions — not noise to tune out.
  service-suite:
    name: Service pytest (shard ${{ matrix.shard }}/6)
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false          # every shard must report, even if one dies
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r service/requirements.txt
          python -m pip install pytest pytest-timeout

      - name: Run service test suite (shard ${{ matrix.shard }}/6)
        working-directory: service
        continue-on-error: true   # a red or hung shard must still reach ensure+upload
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        shell: pwsh
        run: |
          $files = python tools/shard_tests.py --shard ${{ matrix.shard }} --of 6
          if ($LASTEXITCODE -ne 0) { throw "shard planning failed" }
          Write-Host "shard ${{ matrix.shard }}/6 -> $($files.Count) files"
          python -m pytest $files -p no:cacheprovider -ra `
            --junitxml=junit-shard-${{ matrix.shard }}.xml

      # pytest-timeout's thread method ends hangs with os._exit, which skips the
      # junitxml session-end write. Without a file, upload warns and the
      # aggregate reports MISSING — permanently redding diagnostic CI on an
      # intermittent hang (run 31717453274: shard 6 killed mid
      # test_api_incoterm_review_and_bulk). Always materialise a usable XML
      # before upload: real report if present, otherwise an explicit error
      # sentinel (never a silent zero-failure suite).
      - name: Ensure JUnit artifact exists
        if: always()
        working-directory: service
        shell: pwsh
        run: |
          python tools/ensure_junit_artifact.py `
            junit-shard-${{ matrix.shard }}.xml `
            --shard ${{ matrix.shard }}

      - name: Upload shard JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: service/junit-shard-${{ matrix.shard }}.xml
          if-no-files-found: error   # ensure step must have left a file

  # ── Aggregate the shards into one reconciliation ──────────────────────────
  # Prints every failure. Job exit uses `--fail-on incomplete`: exit 1 ONLY when
  # a shard's XML is MISSING/INCOMPLETE. Inherited test failures are reported in
  # the step summary but do NOT fail this job — the suite carries a documented
  # standing red set (see `.claude/contracts/test-baseline.md` GATE-4 SCHEDULED
  # disposition and CLAUDE.md § "CI authority — diagnostic, never a gate").
  # A shard whose results are unknown is still never counted as zero failures —
  # that honesty rule is unchanged; only the *job* exit code stops treating
  # inherited reds as a permanent Actions failure.
  #
  # BRANCH PROTECTION: intentionally unset. If an operator ever enables a
  # required check, it must be this job — NOT `service-suite`. The shard steps
  # are `continue-on-error: true` so a red or hung shard still uploads its XML,
  # which means a shard job can report success while its tests failed. Requiring
  # a shard job would be a green light with nothing behind it.
  #
  # `!cancelled()` rather than `always()`. A newer push cancels the in-flight run
  # (see `concurrency` above), which kills the shards mid-test; under `always()`
  # the aggregate still ran, found their partial or absent XML, and correctly
  # reported red — leaving a FAILED check on a run nobody abandoned for a reason
  # worth reading. That red is pure noise: it fires webhooks, costs a reviewer an
  # investigation, and would sit as a red required check with nothing wrong.
  #
  # This does NOT weaken the lost-shard honesty rule. A hang that used to leave
  # no XML now gets an explicit error sentinel from ensure_junit_artifact.py
  # (complete evidence, visible error — never silent zero failures). A shard
  # that still somehow uploads nothing remains MISSING and still fails. Only a
  # genuinely cancelled run skips, and a cancelled run has no verdict to give.  service-suite-report:
    name: Service pytest (aggregate)
    runs-on: ubuntu-latest
    needs: service-suite
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download every shard report
        uses: actions/download-artifact@v4
        with:
          pattern: junit-shard-*
          path: junit
          merge-multiple: true

      - name: Reconcile shard results
        run: |
          python service/tools/junit_summary.py junit --of 6 \
            --fail-on incomplete \
            --markdown "$GITHUB_STEP_SUMMARY"
