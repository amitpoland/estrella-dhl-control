<!-- base href: resolves all relative script src= against /v2/ regardless of sub-path -->
<!-- Safe: all API calls (/api/v1/...) and pushState (/v2/<page>) are already absolute -->
<base href="/v2/">

<!-- Vendor-first loading: tries local copies in /v2/vendor/ first; falls back to CDN.
     Operator: run service/scripts/download-v2-vendor.ps1 on the Windows server to
     populate vendor/ with local copies (eliminates CDN dependency in production).
     PIN DISCIPLINE: every CDN dependency below MUST be version-pinned. @babel/standalone
     is pinned to 7.x ON PURPOSE — Babel 8 changed @babel/preset-react's default JSX
     runtime from "classic" to "automatic", which emits `import { jsx } from
     "react/jsx-runtime"` at the top of every compiled file. This in-browser pipeline
     appends compiled output as a CLASSIC <script>, so an injected ESM import throws
     "Cannot use import statement outside a module" and the whole shell fails to boot.
     Do NOT bump to @8 without first switching every text/babel tag to runtime:classic.
     Regression guard: service/tests/test_v2_babel_pin.py. -->
<script src="/v2/vendor/react.production.min.js" crossorigin onerror="window.__vnd_react=1"></script>
<script>if(window.__vnd_react)document.write('\x3Cscript src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin\x3E\x3C\/script\x3E');</script>
<script src="/v2/vendor/react-dom.production.min.js" crossorigin onerror="window.__vnd_rdom=1"></script>
<script>if(window.__vnd_rdom)document.write('\x3Cscript src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin\x3E\x3C\/script\x3E');</script>
<script src="/v2/vendor/babel.min.js" onerror="window.__vnd_babel=1"></script>
<script>if(window.__vnd_babel)document.write('\x3Cscript src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"\x3E\x3C\/script\x3E');</script>
<!-- Boot guard: if either vendor files AND CDN both failed to load, show a visible
     message instead of a silent blank screen. -->
<script>
(function() {
  function _showBootError(msg) {
    document.addEventListener('DOMContentLoaded', function() {
      var el = document.getElementById('root') || document.body;
      el.innerHTML = '<div style="font-family:sans-serif;padding:40px;color:#c0392b;">'
        + '<h2>Estrella Atlas — failed to load</h2><p style="margin-top:8px">' + msg + '</p>'
        + '<p style="margin-top:12px;font-size:13px;color:#555">Open browser DevTools (F12) → Console for details.</p>'
        + '<p style="margin-top:8px;font-size:13px;color:#555">Fix: run <code>service/scripts/download-v2-vendor.ps1</code> on the server to add local vendor files.</p>'
        + '</div>';
    });
  }
  if (typeof React === 'undefined')  { _showBootError('React failed to load (vendor file missing and CDN unreachable). Check network or run download-v2-vendor.ps1.'); return; }
  if (typeof ReactDOM === 'undefined') { _showBootError('ReactDOM failed to load (vendor file missing and CDN unreachable). Check network or run download-v2-vendor.ps1.'); return; }
  if (typeof Babel === 'undefined')  { _showBootError('Babel failed to load (vendor file missing and CDN unreachable). Check network or run download-v2-vendor.ps1.'); return; }
  // Surface any uncaught errors (e.g. Babel compile failure or React render crash) visibly.
  window.addEventListener('error', function(ev) {
    var root = document.getElementById('root');
    if (root && root.childElementCount === 0) {
      root.innerHTML = '<div style="font-family:sans-serif;padding:40px;color:#c0392b;">'
        + '<h2>Estrella Atlas — JavaScript error</h2>'
        + '<pre style="margin-top:8px;font-size:12px;white-space:pre-wrap">' + (ev.message || ev) + '\n' + (ev.filename || '') + ':' + ev.lineno + '</pre>'
        + '<p style="margin-top:12px;font-size:13px;color:#555">Open browser DevTools (F12) → Console for full stack trace.</p>'
        + '</div>';
    }
  });
})();
</script>
<!-- apiFetch shim: provides EstrellaShared.apiFetch for pz-api.js.
     dashboard-shared.js intentionally excluded. Reason: only EstrellaShared.apiFetch is
     consumed by v2 (pz-api.js:_apiFetch, proforma-detail.jsx direct call). All other
     EstrellaShared exports are dead code in this context. Loading dashboard-shared.js would
     introduce unnecessary coupling to the Track-1 shared layer (ADR-028). -->
<script>
window.EstrellaShared = {
  apiFetch: async function(url, opts) {
    var res;
    try {
      res = await fetch(url, Object.assign({ credentials: 'include' }, opts || {}));
    } catch (netErr) {
      var ne = new Error('Service unreachable — check that the backend is running.');
      ne.type = 'network';
      throw ne;
    }
    if (res.status === 401 || res.status === 403) {
      var e = new Error('Session expired or access denied.');
      e.type = 'auth';
      e.status = res.status;
      throw e;
    }
    if (!res.ok) {
      var t = await res.text().catch(function(){return '';});
      throw new Error('HTTP ' + res.status + ': ' + t.slice(0, 200));
    }
    if (res.status === 204 || res.status === 205) return null;
    var ct = res.headers.get('content-type') || '';
    return ct.includes('json') ? res.json() : res.text();
  }
};
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent, #c9a456); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }

  /* Shared a11y — focus rings (ui-ux-pro-max / EJ_OVERRIDES) */
  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* ── Responsive — tablet (≤1100px) */
  @media (max-width: 1100px) {
    /* Stat tile rows: 4 → 2 cols */
    [data-screen-label="Shipment Detail"] [style*="repeat(4, 1fr)"],
    .responsive-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
    /* Two-col panel grids → 1 col */
    [data-screen-label="Shipment Detail"] [style*="grid-template-columns: 1fr 1fr"],
    .responsive-grid-2 { grid-template-columns: 1fr !important; }
    /* Tighter padding */
    [data-screen-label="Shipment Detail"] > div[style*="padding: '24px 32px'"],
    .responsive-page-padding { padding: 16px 18px !important; }
  }

  /* ── Tablet & narrower (≤900px) */
  @media (max-width: 900px) {
    .sidebar-desktop { display: none !important; }
    .mobile-hamburger { display: flex !important; }
    .topbar-user-meta { display: none !important; }
    .topbar-header, .atlas-topbar { padding-left: 8px !important; padding-right: 12px !important; gap: 8px !important; }
    .atlas-content-pad { padding: 14px 16px 32px !important; }
    .quick-flow-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .kpi-strip-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .ops-status-strip { padding: 6px 12px !important; }
    /* Page-level padding everywhere */
    [style*="padding: '24px 32px'"], [style*="padding:'24px 32px'"] { padding: 14px 16px !important; }
    /* Sub-header & workflow strip */
    [style*="padding: '16px 32px'"] { padding: 12px 16px !important; gap: 12px !important; flex-wrap: wrap !important; }
    [style*="padding: '20px 32px 0'"] { padding: 14px 12px 0 !important; overflow-x: auto !important; }
    /* Tab bars allow horizontal scroll */
    [style*="borderBottom: '1px solid var(--border)'"][style*="display: 'flex'"][style*="gap: 4"] {
      overflow-x: auto !important; flex-wrap: nowrap !important; -webkit-overflow-scrolling: touch;
    }
    /* Tables: keep table layout; scroll the nearest wrapping parent */
    .table-scroll, [data-table-scroll],
    [data-testid*="table"],
    div:has(> table) {
      overflow-x: auto !important; -webkit-overflow-scrolling: touch; max-width: 100%;
    }
    /* Inline stat divider lines hide */
    [style*="width: 1, height: 32"], [style*="width: 1px"][style*="height: 32px"] { display: none !important; }
  }

  /* ── Phone (≤600px) */
  @media (max-width: 600px) {
    .docs-grid { grid-template-columns: 1fr !important; }
    .quick-flow-grid { grid-template-columns: 1fr !important; }
    .kpi-strip-grid { grid-template-columns: 1fr 1fr !important; }
    .ops-status-meta { display: none !important; }
    .topbar-theme { display: none !important; }
    /* All multi-col grids collapse to 1 col */
    [style*="grid-template-columns: repeat(4, 1fr)"],
    [style*="grid-template-columns: repeat(3, 1fr)"],
    [style*="grid-template-columns: repeat(2, 1fr)"],
    [style*="grid-template-columns: 1fr 1fr"],
    .responsive-grid-4, .responsive-grid-3, .responsive-grid-2 { grid-template-columns: 1fr !important; }
    /* Typography downsizes a touch */
    [data-screen-label="Shipment Detail"] [style*="fontSize: 16"] { font-size: 14px !important; }
    [data-screen-label="Shipment Detail"] [style*="fontSize: 22"],
    [data-screen-label="Shipment Detail"] [style*="fontSize: 20"] { font-size: 18px !important; }
    /* Workflow stage labels: shrink */
    [data-screen-label="Shipment Detail"] [style*="fontSize: 10"][style*="fontWeight"] { font-size: 9px !important; }
    /* Buttons stack */
    [style*="display: 'flex'"][style*="flexWrap: 'wrap'"][style*="gap: 8"] > button,
    [style*="display: 'flex'"][style*="flexWrap: 'wrap'"][style*="gap: 10"] > button {
      flex: 1 1 calc(50% - 4px) !important; min-width: 0 !important;
    }
    /* Page header: vertical stack */
    [style*="display: 'flex'"][style*="justifyContent: 'space-between'"][style*="alignItems: 'center'"] {
      flex-wrap: wrap !important; gap: 10px !important;
    }
    /* Top-bar search shrinks */
    input[placeholder*="Search"] { max-width: 140px !important; }
    /* Sub-header inner items wrap nicely */
    [data-screen-label="Shipment Detail"] > div:first-of-type > div { min-width: 0 !important; }
  }

  /* Responsive dashboard grids (kanban / quick-flow) */
  .atlas-content-pad { padding: 20px 32px 40px; }
  .quick-flow-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi-strip-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .kanban-board {
    display: grid;
    grid-template-columns: repeat(6, minmax(220px, 1fr));
    gap: 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  @media (max-width: 1100px) {
    .quick-flow-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .kpi-strip-grid { grid-template-columns: repeat(3, 1fr) !important; }
  }

<script type="text/babel" src="document-group-card.jsx"></script>
<script type="text/babel" src="proforma-detail.jsx"></script>
<script type="text/babel" src="supplier-invoice-review.jsx"></script>
<script type="text/babel" src="global-search.jsx"></script>
<script type="text/babel" src="advance-packing.jsx"></script>
<!-- Sprint 31: live DHL cards composed by DhlCustomsPage (window.DhlScanStatus / window.DhlDailySummary). -->
<script type="text/babel" src="dhl-scan-status.jsx"></script>
<script type="text/babel" src="dhl-daily-summary.jsx"></script>
<!-- tweaks-panel.jsx excluded — omelette runtime not available in production -->
<script type="text/babel" src="mock-badge.jsx"></script>
<script type="text/babel">

// tweaks-panel replaced with inline state (no omelette runtime needed)
const TWEAK_DEFAULTS = {
  "darkMode": false,
  "compactRows": false,
  "showApiChecklist": false
};

// Minimal useTweaks shim — replaces omelette-backed version
function useTweaks(defaults) {
  const [tweaks, setTweaks] = React.useState(defaults);
  const setTweak = (k, v) => setTweaks(prev => ({ ...prev, [k]: v }));
  return { tweaks, setTweak };
}

function App() {
  const { tweaks, setTweak } = useTweaks(TWEAK_DEFAULTS);
  const isDark = tweaks?.darkMode ?? false;
  const setIsDark = v => setTweak('darkMode', v);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  }, [isDark]);

  // ── URL helpers ──────────────────────────────────────────────────────────────
  // Pages that carry a persistent ?batch_id= param (preserved across their sub-routes)
  // `shipments` keeps batch_id so Open-in-New-Tab / deep links open V2 detail.
  const BATCH_SCOPED_PAGES = ['proforma', 'proforma_detail', 'shipments'];

  // Legacy route slugs → canonical page ids.
  // Sprint 31: the 'dhl: shipments' redirect was removed — DHL is now a
  // discoverable top-level page (NAV_TREE entry + page === 'dhl' route).
  // Routing 'dhl' to 'shipments' would silently bypass the live DHL Hub.
  // B×7-1 → Phase B FOLD (2026-07-03): the move page (move_stock renamed
  // move_location) is RETIRED — its capability folded into the Inventory page
  // as the Move Stock modal (Lesson M relocation; PROJECT_STATE DECISIONS
  // "Phase B FOLD"). BOTH slugs now redirect to inventory (stale-URL
  // insurance): move_stock (also reserved for the future PZ-event promotion)
  // and move_location (the retired page). The redirects are stale-URL
  // insurance for unpromoted / retired slugs.
  const ROUTE_REDIRECTS = {
    actions:       'inbox',
    proposals:     'inbox',
    email_queue:   'inbox',
    reservation:   'inbox',
    shipping:      'shipments',
    scanner:       'inventory',
    identity:      'inventory',
    sample_out:    'inventory',
    sample_return: 'inventory',
    goods_return:  'inventory',
    return_prod:   'inventory',
    move_stock:    'inventory',
    move_location: 'inventory',
  };

  // Parse /v2/<page>[?query] → { page, search, bare }
  // bare=true when URL is /v2/ or /v2/index.html — resolve to default_page after /auth/me.
  function parseV2Location() {
    const raw = window.location.pathname.replace(/^\/v2\/?/, '') || '';
    let slug = raw.split('/')[0] || '';
    if (slug === 'index.html') slug = '';
    const bare = !slug;
    const target = slug ? (ROUTE_REDIRECTS[slug] || slug) : '';
    return { page: target, search: window.location.search, bare: bare };
  }

  // Build the URL for a given page, preserving batch_id for scoped pages
  function pageToUrl(target, currentSearch) {
    const sp = new URLSearchParams(currentSearch || '');
    const batchId = sp.get('batch_id') || '';
    const draftId = sp.get('draft') || '';
    const params = new URLSearchParams();
    if (BATCH_SCOPED_PAGES.includes(target) && batchId) {
      params.set('batch_id', batchId);
      if (target === 'proforma_detail' && draftId) params.set('draft', draftId);
    }
    const qs = params.toString();
    return '/v2/' + target + (qs ? '?' + qs : '');
  }

  // Shipment deep-link helper — detail is in-shell page:'detail' but URL stays
  // /v2/shipments?batch_id=… so Open-in-New-Tab and bookmarks work.
  function shipmentDetailUrl(batchId) {
    const qs = batchId ? ('?batch_id=' + encodeURIComponent(batchId)) : '';
    return '/v2/shipments' + qs;
  }

  const AC = window.AuthorityConsumer || {};
  // The shell is only a consumer. Losing authority-consumer.js must make it LESS
  // capable, never more — so there is no degraded inline gate to fall back to.
  // Every authorization decision requires the canonical consumer to be present.
  const AC_READY = (
    typeof AC.pageIsAllowed === 'function'
    && typeof AC.normalizeAuthority === 'function'
    && typeof AC.resolveGateTarget === 'function'
    && typeof AC.failClosedToLogin === 'function'
    && typeof AC.fetchAuthMe === 'function'
  );
  const pageIsAllowed = AC_READY ? AC.pageIsAllowed : function () { return false; };

  // ── Initial state from URL ─────────────────────────────────────────────────
  const _initialLocation = parseV2Location();
  const _initShipmentBatchId = (
    _initialLocation.page === 'shipments'
      ? (new URLSearchParams(_initialLocation.search).get('batch_id') || '')
      : ''
  );
  // Fail closed on first paint: NO page is derived from the URL before authority
  // exists. The requested location is not lost — applyAuthorityGate re-reads it
  // with parseV2Location() once /auth/me resolves, and resolveGateTarget decides.
  // Seeding `page` from the URL here would render the requested protected page
  // for one frame before any gate ran; `page: ''` matches no content block.
  const [page, setPage] = React.useState('');
  const [activeNav, setActiveNav] = React.useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = React.useState(false);
  const [selectedShipment, setSelectedShipment] = React.useState(
    _initShipmentBatchId ? { batch_id: _initShipmentBatchId } : null
  );
  const [showNewShipment, setShowNewShipment] = React.useState(false);
  const [showApiChecklist, setShowApiChecklist] = React.useState(false);
  const [mobileSidebarOpen, setMobileSidebarOpen] = React.useState(false);
  const [isNarrow, setIsNarrow] = React.useState(() =>
    typeof window !== 'undefined' && window.matchMedia('(max-width: 900px)').matches
  );
  const [viewerDoc, setViewerDoc] = React.useState(null);
  const [searchOpen, setSearchOpen] = React.useState(false);
  const [proformaDraft, setProformaDraft] = React.useState(null);
  const [proformaHydrating, setProformaHydrating] = React.useState(_initialLocation.page === 'proforma_detail');
  const [proformaHydrateError, setProformaHydrateError] = React.useState(null);
  const [currentSearch, setCurrentSearch] = React.useState(_initialLocation.search);
  // Slice 1 — consume /auth/me via AuthorityConsumer (no frontend catalogue).
  const [authority, setAuthority] = React.useState(null);
  const [authorityStatus, setAuthorityStatus] = React.useState('loading');

  const openViewer = (doc) => setViewerDoc(doc);
  const closeViewer = () => setViewerDoc(null);

  React.useEffect(() => {
    const mql = window.matchMedia('(max-width: 900px)');
    const onChange = (e) => {
      setIsNarrow(e.matches);
      if (!e.matches) setMobileSidebarOpen(false);
    };
    setIsNarrow(mql.matches);
    if (mql.addEventListener) mql.addEventListener('change', onChange);
    else mql.addListener(onChange);
    return () => {
      if (mql.removeEventListener) mql.removeEventListener('change', onChange);
      else mql.removeListener(onChange);
    };
  }, []);

  React.useEffect(() => {
    if (!mobileSidebarOpen) return undefined;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const onKey = (e) => { if (e.key === 'Escape') setMobileSidebarOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => {
      document.body.style.overflow = prev;
      window.removeEventListener('keydown', onKey);
    };
  }, [mobileSidebarOpen]);

  // Only ever called with AC_READY true — the canonical consumer is the authority.
  function applyAuthorityGate(me) {
    const auth = AC.normalizeAuthority(me);
    if (auth.default_surface === 'v1') {
      window.location.href = '/dashboard/dashboard.html';
      return;
    }
    // Fail closed on malformed /auth/me — deny the render first, then logout.
    // The redirect is cleanup, never the gate: `page: ''` matches no content
    // block, so nothing protected is on screen while it is in flight.
    if (auth.malformed) {
      setPage('');
      setActiveNav('dashboard');
      setAuthority(auth);
      setAuthorityStatus('fallback');
      AC.failClosedToLogin();
      return;
    }
    setAuthority(auth);
    setAuthorityStatus('ready');
    const loc = parseV2Location();
    const want = AC.resolveGateTarget(auth, loc, { detailBatchId: _initShipmentBatchId });
    if (!want) {
      setPage('');
      setActiveNav('dashboard');
      return;
    }
    if (want === 'detail' && _initShipmentBatchId && pageIsAllowed('shipments', auth.allowed_pages)) {
      setPage('detail');
      setActiveNav('shipments');
      return;
    }
    if (want !== loc.page || loc.bare) {
      const url = pageToUrl(want === 'detail' ? 'shipments' : want, want === 'detail' ? loc.search : (loc.bare ? '' : loc.search));
      history.replaceState({ page: want }, '', url);
      if (want !== 'detail') setSelectedShipment(null);
    }
    setPage(want);
    setActiveNav(want === 'detail' ? 'shipments' : (want === 'proforma_detail' || want === 'proforma_search' ? 'proforma' : want));
  }

  React.useEffect(() => {
    let cancelled = false;
    // authority-consumer.js absent or incomplete → there is no authority to
    // consume. Deny every page and bounce; do NOT authorize the requested URL.
    if (!AC_READY) {
      setPage('');
      setActiveNav('dashboard');
      setAuthorityStatus('fallback');
      fetch('/auth/logout', { method: 'POST', credentials: 'include' })
        .catch(function () { /* still bounce */ })
        .then(function () { window.location.href = '/login'; });
      return function () { cancelled = true; };
    }
    AC.fetchAuthMe()
      .then(function (me) {
        if (cancelled || !me) return;
        applyAuthorityGate(me);
      })
      .catch(function (err) {
        if (cancelled) return;
        setPage('');
        setActiveNav('dashboard');
        setAuthorityStatus('fallback');
        AC.failClosedToLogin();
      });
    return function () { cancelled = true; };
  }, []);

  const handleProformaDrill = (draft) => {
    setProformaDraft(draft);
    const sp = new URLSearchParams(currentSearch || '');
    if (draft && draft.id) sp.set('draft', String(draft.id));
    const newSearch = sp.toString() ? '?' + sp.toString() : '';
    setCurrentSearch(newSearch);
    const url = pageToUrl('proforma_detail', newSearch);
    history.pushState({ page: 'proforma_detail' }, '', url);
    setPage('proforma_detail');
    setActiveNav('proforma');
  };

  const handleProformaBack = () => {
    setProformaDraft(null);
    const url = pageToUrl('proforma', currentSearch);
    history.pushState({ page: 'proforma' }, '', url);
    setPage('proforma');
  };

  // ── handleProformaSearchDrill: navigate from search results to batch list ──
  const handleProformaSearchDrill = (batchId) => {
    if (!batchId) return;
    const qs = '?batch_id=' + encodeURIComponent(batchId);
    setCurrentSearch(qs);
    history.pushState({ page: 'proforma' }, '', '/v2/proforma' + qs);
    setPage('proforma');
    setActiveNav('proforma');
  };

  // ── popstate: browser back/forward ─────────────────────────────────────────
  React.useEffect(() => {
    const onPop = () => {
      const loc = parseV2Location();
      setCurrentSearch(loc.search);
      if (loc.page !== 'proforma_detail') setProformaDraft(null);
      const batchId = new URLSearchParams(loc.search || '').get('batch_id') || '';
      const allowed = authority && authority.allowed_pages;
      // Fail closed: history navigation is authorized only by ready authority.
      const denyAll = () => {
        setSelectedShipment(null);
        setPage('');
        setActiveNav('dashboard');
      };
      if (!authority || authorityStatus !== 'ready') {
        denyAll();
        return;
      }
      const gate = (p) => pageIsAllowed(p, allowed);
      // A denied page falls back to default_page only when that is itself
      // allowed — an unauthorized Dashboard is not a safe landing.
      const safeFallback = () => {
        const d = authority.default_page || '';
        return gate(d) ? d : '';
      };
      const landOnFallback = (search) => {
        const fb = safeFallback();
        if (!fb) {
          denyAll();
          return;
        }
        history.replaceState({ page: fb }, '', pageToUrl(fb, search));
        setPage(fb);
        setActiveNav(fb);
      };
      if (loc.page === 'shipments' && batchId) {
        if (!gate('shipments')) {
          landOnFallback('');
          return;
        }
        setSelectedShipment({ batch_id: batchId });
        setPage('detail');
        setActiveNav('shipments');
        return;
      }
      if (loc.page === 'shipments') setSelectedShipment(null);
      const want = loc.bare ? (authority.default_page || '') : loc.page;
      if (!want || !gate(want)) {
        landOnFallback(loc.search);
        return;
      }
      setPage(want);
      setActiveNav(want === 'detail' ? 'shipments' : (want === 'proforma_detail' || want === 'proforma_search' ? 'proforma' : want));
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, [authority, authorityStatus]);

  // ── proforma_detail URL-param hydration (bookmark / refresh / direct link) ─
  // Fires when the page is proforma_detail but no draft is in state.
  // Reads ?draft=<id> or falls back to ?batch_id= (first draft in batch).
  React.useEffect(() => {
    if (page !== 'proforma_detail' || proformaDraft) return;
    const sp      = new URLSearchParams(window.location.search);
    // Canonical param is ?draft=; accept ?draft_id= as Documents-hub / legacy alias (B-014).
    const rawId   = sp.get('draft') || sp.get('draft_id');
    const batchId = sp.get('batch_id');
    if (!rawId && !batchId) {
      setProformaHydrating(false);
      setProformaHydrateError('No draft or batch_id in URL — cannot load draft.');
      return;
    }
    if (rawId) {
      const id = parseInt(rawId, 10);
      if (!id || id <= 0) {
        setProformaHydrating(false);
        setProformaHydrateError('Invalid draft ID in URL.');
        return;
      }
      setProformaHydrating(true);
      setProformaHydrateError(null);
      window.EstrellaShared.apiFetch('/api/v1/proforma/draft/' + id)
        .then(r => {
          if (!r || !r.draft) throw new Error('Draft not found.');
          setProformaDraft(r.draft);
          setProformaHydrating(false);
        })
        .catch(err => { setProformaHydrateError((err && err.message) || 'Failed to load draft.'); setProformaHydrating(false); });
      return;
    }
    setProformaHydrating(true);
    setProformaHydrateError(null);
    window.EstrellaShared.apiFetch('/api/v1/proforma/drafts/' + encodeURIComponent(batchId))
      .then(r => {
        if (!r || !r.drafts || !r.drafts.length) throw new Error('No proforma drafts found for this batch.');
        return window.EstrellaShared.apiFetch('/api/v1/proforma/draft/' + r.drafts[0].id);
      })
      .then(r => {
        if (!r || !r.draft) throw new Error('Draft not found.');
        setProformaDraft(r.draft);
        setProformaHydrating(false);
      })
      .catch(err => { setProformaHydrateError((err && err.message) || 'Failed to load draft.'); setProformaHydrating(false); });
  // `proformaDraft` is intentionally excluded from the dependency array.
  // The guard at the top of the effect (`|| proformaDraft`) already prevents a
  // double-fetch when the draft is already loaded. Including it in deps would
  // cause the effect to re-fire on every field update inside the draft object,
  // creating an infinite re-fetch loop.
  }, [page]); // eslint-disable-line react-hooks/exhaustive-deps

  // ── Cmd-K / Ctrl-K: global search ─────────────────────────────────────────
  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        setSearchOpen(o => !o);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const handleViewShipment = (shipment) => {
    const batchId = shipment && (shipment.batch_id || shipment.id) || '';
    setSelectedShipment(shipment);
    const url = shipmentDetailUrl(batchId);
    const search = batchId ? ('?batch_id=' + encodeURIComponent(batchId)) : '';
    setCurrentSearch(search);
    history.pushState({ page: 'detail', batch_id: batchId }, '', url);
    setPage('detail');
    setActiveNav('shipments');
  };

  const handleBackFromShipmentDetail = () => {
    setSelectedShipment(null);
    setCurrentSearch('');
    history.pushState({ page: 'shipments' }, '', '/v2/shipments');
    setPage('shipments');
    setActiveNav('shipments');
  };

  // ── handleNav: sidebar / programmatic navigation + pushState ───────────────
  const handleNav = (id) => {
    const target = ROUTE_REDIRECTS[id] || id;
    // Fail closed: navigation is authorized only by ready authority, and the
    // fallback landing must itself be allowed.
    if (!authority || authorityStatus !== 'ready') {
      setPage('');
      setActiveNav('dashboard');
      setMobileSidebarOpen(false);
      return;
    }
    if (!pageIsAllowed(target, authority.allowed_pages)) {
      const d = authority.default_page || '';
      const fallback = pageIsAllowed(d, authority.allowed_pages) ? d : '';
      if (fallback) history.pushState({ page: fallback }, '', pageToUrl(fallback, currentSearch));
      setActiveNav(fallback || 'dashboard');
      setPage(fallback);
      setMobileSidebarOpen(false);
      return;
    }
    const url = pageToUrl(target, currentSearch);
    history.pushState({ page: target }, '', url);
    // Keep Pro Forma sidebar highlight on search/detail sub-views
    // (same pattern as shipments detail → activeNav stays 'shipments').
    setActiveNav(target === 'proforma_search' || target === 'proforma_detail' ? 'proforma' : target);
    setPage(target);
    setMobileSidebarOpen(false);
    if (!BATCH_SCOPED_PAGES.includes(target) && target !== 'proforma_search') setProformaDraft(null);
  };

  const allowedPagesProp = (authorityStatus === 'loading' || !authority)
    ? []
    : (authority.allowed_pages || []);

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }} data-testid="v2-shell-root">
      {authorityStatus === 'loading' && (
        <div data-testid="v2-authority-loading" style={{
          position: 'fixed', inset: 0, zIndex: 500, display: 'flex',
          alignItems: 'center', justifyContent: 'center',
          background: 'var(--bg)', color: 'var(--text-3)',
          fontFamily: 'Plus Jakarta Sans, sans-serif', fontSize: 13,
        }}>Loading authority…</div>
      )}

      {/* Desktop Sidebar — unmount on narrow so it cannot crush content */}
      {!isNarrow && (
        <div className="sidebar-desktop" data-testid="sidebar-desktop" style={{ display: 'flex', flexShrink: 0 }}>
          <Sidebar
            active={activeNav}
            onNav={handleNav}
            collapsed={sidebarCollapsed}
            onToggle={() => setSidebarCollapsed(v => !v)}
            allowedPages={allowedPagesProp}
          />
        </div>
      )}

      {/* Mobile drawer — left panel; z-index above MOCK banner */}
      {isNarrow && mobileSidebarOpen && (
        <div
          data-testid="mobile-nav-drawer"
          style={{ position: 'fixed', inset: 0, zIndex: 1100, display: 'flex' }}
          role="dialog"
          aria-modal="true"
          aria-label="Navigation menu"
        >
          <div style={{
            width: 'min(280px, 86vw)', background: 'var(--sidebar-bg)', height: '100%',
            overflowY: 'auto', flexShrink: 0, boxShadow: '8px 0 24px var(--shadow-heavy)',
          }}>
            <Sidebar active={activeNav} onNav={handleNav} collapsed={false} onToggle={() => setMobileSidebarOpen(false)} allowedPages={allowedPagesProp} />
          </div>
          <div data-testid="mobile-nav-backdrop" style={{ flex: 1, minWidth: 0, background: 'var(--overlay)' }} onClick={() => setMobileSidebarOpen(false)} />
        </div>
      )}

      {/* Main */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', minWidth: 0 }}>
        <div style={{ flexShrink: 0 }}>
          <TopBar
            onNewShipment={() => setShowNewShipment(true)}
            onToggleDark={() => setIsDark(d => !d)}
            isDark={isDark}
            onOpenSearch={() => setSearchOpen(true)}
            onOpenMobileNav={isNarrow ? (() => setMobileSidebarOpen(true)) : undefined}
            onOpenMenu={isNarrow ? (() => setMobileSidebarOpen(true)) : undefined}
          />
          <OperationalStatusStrip />
        </div>

        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>

          {/* MOCK badge — shown for every un-wired page (Sprint 1, Phase 3) */}
          {!viewerDoc && <MockBanner page={page} />}

          {/* Document viewer — full-page route */}
          {viewerDoc && (
            <DocumentViewerPage doc={viewerDoc} onBack={closeViewer} />
          )}

          {/* Dashboard — Kanban pipeline (simplified flow) */}
          {!viewerDoc && (page === 'dashboard') && (
            <>
              <PageHeader
                title="Dashboard"
                subtitle={`${new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })} · Pipeline view — every active shipment, one glance`}
                actions={<div style={{ display: 'flex', gap: 8 }}><Btn variant="outline" small onClick={() => setShowApiChecklist(true)}>API Checklist</Btn><Btn variant="outline" small>↓ Export CSV</Btn></div>}
              />
              <DashboardKanban onNav={handleNav} onOpenNewShipment={() => setShowNewShipment(true)} onOpenSearch={() => setSearchOpen(true)} />
            </>
          )}

          {/* Inbox — unified queue (replaces Action Center · Email Queue · Operator Queue · Action Proposals · Reservations) */}
          {!viewerDoc && page === 'inbox' && (
            <>
              <PageHeader title="Inbox"
                subtitle="Everything that needs your attention — emails · proposals · approvals · reservations · customs holds"
                actions={<div style={{ display: 'flex', gap: 8 }}><Btn variant="outline" small>↻ Sync now</Btn><Btn variant="outline" small>⚙ Rules</Btn></div>}
              />
              <InboxPage onNav={handleNav} />
            </>
          )}

          {/* Shipments — canonical V2 front/list (B1 operational parity) */}
          {!viewerDoc && page === 'shipments' && (
            <>
              <PageHeader title="Shipments" subtitle="Operational shipment hub — newest upload first. View opens V2 detail. Recheck / Archive use the same dashboard batch authority as B1." />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              {/* Advance (pre-shipment) packing lists: goods announced but not
                  yet dispatched, so they have no shipment row to hang off. */}
              <div style={{ padding: '0 32px' }}>
                {window.AdvancePackingHub && <window.AdvancePackingHub />}
              </div>
              <DashboardPage onViewShipment={handleViewShipment} />
            </>
          )}

          {/* Detail view — existing V2 Shipment Detail authority (unchanged business behavior) */}
          {!viewerDoc && page === 'detail' && selectedShipment && (
            <>
              <div style={{ padding: '20px 32px 0', flexShrink: 0 }}>
                <h1 style={{ margin: 0, fontSize: 22, fontWeight: 700, fontFamily: '"DM Serif Display", serif', color: 'var(--text)' }}>Shipment Detail</h1>
              </div>
              <ShipmentDetailPage shipment={selectedShipment} onBack={handleBackFromShipmentDetail} />
            </>
          )}

          {/* DHL Hub — read-only observer (Sprint 31). Visibility only:
              Lane A / Lane B / Task Scheduler remain the sole automation authority.
              No Retry / Requeue / Scan / Lane / Force / Refresh affordances. */}
          {!viewerDoc && page === 'dhl' && (
            <>
              <PageHeader title="DHL / Customs" subtitle="Logistics Control Tower — inbound + outbound tracking, stage durations, delay analysis. Read-only. Automation Health is secondary." />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <DhlCustomsPage onViewShipment={handleViewShipment} />
            </>
          )}

          {/* Accounting — wFirma-mapped documents + ledgers */}
          {!viewerDoc && page === 'accounting' && (
            <>
              <PageHeader title="Accounting"
                subtitle="Proforma · Invoice · WZ · PZ · PW · RW · MM · Client Balance · Client Ledger · Supplier Ledger — all mapped from wFirma"
                actions={<div style={{ display: 'flex', gap: 8 }}><Btn variant="outline" small onClick={() => setShowApiChecklist(true)}>API Checklist</Btn><Btn variant="outline" small>↻ Sync wFirma</Btn><Btn variant="outline" small>↓ Export</Btn></div>}
              />
              <AccountingHub onNav={handleNav} />
            </>
          )}

          {/* Inventory — read-only live hub (Sprint 30). No shell-level write actions:
              the hub is read-only, so Upload/Move-Stock/Cycle-count/Export buttons
              were removed (they dispatched events the live component does not handle). */}
          {!viewerDoc && page === 'inventory' && (
            <>
              <PageHeader title="Inventory" subtitle="Inventory hub — Stage 1 & 2 registers, sample-out / returns / move-stock actions, warehouse audit, and live reconciliation." />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <InventoryPage openViewer={openViewer} />
            </>
          )}

          {/* Move Location render block RETIRED (Phase B FOLD, 2026-07-03):
              the capability is folded into the Inventory page as the Move
              Stock modal (Lesson M relocation). /v2/move_location now
              redirects to inventory (ROUTE_REDIRECTS, stale-URL insurance). */}

          {/* Intelligence Hub — wired to live intelligence + invoice-learning authority (Sprint 34) */}
          {!viewerDoc && page === 'intelligence' && (
            <>
              <PageHeader title="Intelligence Hub" subtitle="Engine status, live trigger suggestions, risk warnings, config, and invoice-learning patterns" />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <IntelligencePage />
            </>
          )}

          {/* Action Center — operator approval queue (R-Q2: /automation -> Action Center -> AI Bridge backend capability) */}
          {!viewerDoc && page === 'automation' && (
            <>
              <PageHeader title="Action Center" subtitle="Pending operator approvals — PZ adoptions · proforma approvals · credit limits · returns · AI Bridge proposals" />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <ActionCenterPage />
            </>
          )}

          {/* Carriers — multi-carrier login & API integration */}
          {!viewerDoc && page === 'carriers' && (
            <>
              <PageHeader title="Carriers" subtitle="Multi-carrier login · API integration · webhooks · sessions · audit log. Backend wireframe — no live credentials."
                actions={<div style={{ display: 'flex', gap: 8 }}><Btn variant="outline" small onClick={() => setShowApiChecklist(true)}>API Checklist</Btn><Btn variant="gold" small disabled style={{ opacity: 0.7, cursor: 'not-allowed' }}>+ Connect Carrier</Btn></div>}
              />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <CarriersPage />
            </>
          )}

          {/* API Status — consolidated single-page health for every integration */}
          {!viewerDoc && page === 'api_status' && (
            <>
              <PageHeader title="API Status" subtitle="Consolidated health for every backend integration · carriers · accounting · customs · internal services · webhooks. Replaces scattered API-status surfaces."
                actions={<div style={{ display: 'flex', gap: 8 }}><Btn variant="outline" small onClick={() => setShowApiChecklist(true)}>API Checklist</Btn><Btn variant="outline" small disabled style={{ opacity: 0.7, cursor: 'not-allowed' }}>↻ Re-probe All</Btn></div>}
              />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <ApiStatusPage />
            </>
          )}

          {/* Documents Hub — full CRUD for every document type */}
          {!viewerDoc && page === 'documents' && (
            <>
              <PageHeader title="Documents" subtitle="Unified workspace for every document the system creates · Proforma · Invoice · PZ · Order · Customs · Shipping · Email. Full create / edit / delete / view / download." />
              <DocumentsHubPage />
            </>
          )}

          {/* Supplier Invoice OCR — foreign-invoice extraction drafts + operator
              review. Draft store only: confirmed values are the operator's
              reference for booking the wFirma expense MANUALLY (expenses/add
              unverified — docs/WFIRMA_API_VALIDATED_MAP.md). */}
          {!viewerDoc && page === 'supplier_invoice_review' && (
            <>
              <PageHeader title="Supplier Invoices" subtitle="Foreign supplier invoice OCR · upload → AI extraction → operator review → confirm. No wFirma write — confirmed drafts are the reference for manual expense booking." />
              <SupplierInvoiceReviewPage />
            </>
          )}

          {/* Pro Forma — Screen A (list) */}
          {!viewerDoc && page === 'proforma' && (
            <>
              <PageHeader title="Pro Forma" subtitle="Draft pro forma invoices · Convert to invoice when ready"
                actions={<div style={{ display: 'flex', gap: 8 }}><Btn variant="outline" small onClick={() => handleNav('proforma_search')}>Search All Drafts</Btn><Btn variant="outline" small disabled title="Export CSV — not yet wired on this list (no download endpoint)">↓ Export CSV</Btn></div>}
              />
              <ProformaListPage onDrill={handleProformaDrill} />
            </>
          )}

          {/* Pro Forma — Screen C (cross-batch search, M6) */}
          {!viewerDoc && page === 'proforma_search' && (
            <>
              <PageHeader title="Prior Proforma Search" subtitle="Cross-batch read-only search across all local proforma drafts"
                actions={<Btn variant="outline" small onClick={() => handleNav('proforma')}>Back to Pro Forma</Btn>}
              />
              <ProformaSearchPage onNav={handleNav} onDrillBatch={handleProformaSearchDrill} />
            </>
          )}

          {/* Pro Forma — Screen B (detail) */}
          {!viewerDoc && page === 'proforma_detail' && (
            proformaHydrating
              ? <div data-testid="proforma-detail-loading" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: 200, color: 'var(--text-2)', fontSize: 14 }}>Loading draft…</div>
              : proformaHydrateError
                ? <div data-testid="proforma-detail-error" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: 200, gap: 12 }}>
                    <div style={{ color: 'var(--badge-red-text)', fontSize: 14 }}>{proformaHydrateError}</div>
                    <Btn variant="outline" small onClick={handleProformaBack}>← Back to Proforma list</Btn>
                  </div>
                : proformaDraft
                  ? <ProformaDetailPage
                      key={proformaDraft.id}
                      draft={proformaDraft}
                      onBack={handleProformaBack}
                      // Conversion succeeded in wFirma. Stay on the page: the detail
                      // page has already re-fetched the draft, and every projection
                      // (identity card, workflow rail, status header, convert gate)
                      // re-derives from that canonical state. Navigating away here —
                      // as the former stub did — is what left the operator without
                      // any converged view of the invoice they had just created.
                      onConvert={() => {}}
                    />
                  : null
          )}

          {/* Coverage Map — authority: /openapi.json */}
          {!viewerDoc && page === 'coverage' && (
            <>
              <PageHeader title="Coverage Map" subtitle="Live route registry from OpenAPI spec — every route registered in the running backend" />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <CoverageMapPage />
            </>
          )}

          {/* Reports — financial & sales focused */}
          {!viewerDoc && page === 'reports' && (
            <>
              <PageHeader title="Reports" subtitle="Financial, sales, purchase, and shipping reports — date-filtered with drill-down"
                actions={<div style={{ display: 'flex', gap: 8 }}><Btn variant="outline" small>↓ Export PDF</Btn><Btn variant="outline" small>↓ Export CSV</Btn></div>}
              />
              <ReportsPage />
            </>
          )}

          {/* Master Data */}
          {!viewerDoc && page === 'master' && (
            <>
              <PageHeader title="Master Data" subtitle="Create and edit all master records — clients, suppliers, products, designs, HS codes, FX, users, roles" />
              <MasterPage />
            </>
          )}

          {/* wFirma Setup & Mapping */}
          {!viewerDoc && page === 'wfirma_setup' && (
            <>
              <PageHeader title="wFirma Mapping" subtitle="Customer + product mapping · capabilities · reservation gate readiness" />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <WfirmaMappingPage />
            </>
          )}

          {/* System Diagnostics */}
          {!viewerDoc && page === 'diagnostics' && (
            <>
              <PageHeader title="System Diagnostics" subtitle="Health checks · storage · locks · CLI diagnostic tools" />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <DiagnosticsPage />
            </>
          )}

          {/* Admin / Settings */}
          {!viewerDoc && page === 'admin' && (
            <>
              <PageHeader title="Admin / Settings" subtitle="API configuration, users, and system status"
                actions={<Btn variant="outline" small onClick={() => setShowApiChecklist(true)}>API Checklist</Btn>}
              />
              <SubTabStrip active={page} onNav={handleNav} allowedPages={allowedPagesProp} />
              <AdminSettingsPage />
            </>
          )}

          {/* Shipping Ops — live projection of carrier + DHL logistics authorities */}
          {!viewerDoc && page === 'shipping_ops' && (
            <>
              <PageHeader title="Shipping Operations" subtitle="Live carrier queue · documents · returns — projection of /api/v1/carrier/* and /api/v1/dhl/logistics/*" />
              <ShippingOpsPage onViewShipment={handleViewShipment} onNav={handleNav} />
            </>
          )}

        </div>
      </div>

      {showNewShipment && (
        <NewShipmentModal
          onClose={() => setShowNewShipment(false)}
          onCreated={(data) => {
            setShowNewShipment(false);
            // Navigate to the REAL created batch. Passing a raw-shape object
            // with batch_id lets ShipmentDetailPage fetch live detail via
            // getBatchDetail(batch_id); _normalizeShipment maps the rest.
            handleViewShipment({
              batch_id: data.batchId,
              tracking_no: data.awb,
              carrier: data.carrier,
              status: 'draft',
            });
          }}
        />
      )}

      {showApiChecklist && <ApiChecklistModal onClose={() => setShowApiChecklist(false)} />}

      <GlobalSearch open={searchOpen} onClose={() => setSearchOpen(false)} onNav={handleNav} />

      {/* TweaksPanel removed — omelette runtime not available in production */}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
