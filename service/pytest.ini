[pytest]
# ── Per-test watchdog ─────────────────────────────────────────────────────────
#
# INVARIANT: this timeout MUST stay comfortably ABOVE the longest blocking wait
# a test can enter — in this tree that is sqlite3.connect(..., timeout=30.0),
# used at six sites (proforma_invoice_link_db and peers).
#
# Why it matters: timeout_method = thread is mandatory on Windows (the `signal`
# method is POSIX-only), and the thread method cannot interrupt a blocked C
# call — it terminates the WHOLE pytest process. So when the watchdog and a
# SQLite busy-wait are both 30s, a locked database is a coin flip between "one
# test fails with OperationalError: database is locked" and "the entire run dies
# having written no JUnit XML".
#
# Not hypothetical: CI run 30640385564 lost every result in shard 2 exactly this
# way — the watchdog fired inside sqlite3.connect() during
# test_inbox_proforma_draft_source.py::test_posting_is_high, killed the process,
# and the shard uploaded no report at all.
#
# At 120s the SQLite wait always loses the race: connect raises at 30s, that one
# test fails normally, and the shard still produces a complete report. A test
# that genuinely hangs is still killed — at 120s instead of 30s, which the
# 90-minute job timeout bounds.
#
# Pinned by tests/test_ci_shard_partition.py::test_pytest_timeout_exceeds_sqlite_busy_timeouts
# Do not lower this below the largest sqlite connect timeout without reading that test.
timeout = 120
timeout_method = thread
markers =
    smoke: fast, side-effect-free, high-value gate subset
